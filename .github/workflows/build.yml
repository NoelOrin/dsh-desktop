name: Build & Release

on:
  push:
    branches:
      - release
  pull_request:
    paths:
      - "apps/shell/**"
      - "packages/**"
      - "package.json"
      - "yarn.lock"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Enable Corepack
        run: corepack enable

      - name: Bump version
        id: bump
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: node .github/scripts/bump-version.mjs

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-14
            bundles: dmg
            artifact: DSH-Desktop-macOS-arm64
            bundle: |
              apps/shell/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows (x64)
            os: windows-latest
            bundles: nsis
            artifact: DSH-Desktop-Windows-x64
            bundle: |
              apps/shell/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux (x64)
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: DSH-Desktop-Linux-x64
            bundle: |
              apps/shell/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/shell/src-tauri/target/release/bundle/deb/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri

      - name: Get Yarn cache directory
        id: yarn-cache
        shell: bash
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build Tauri app
        run: corepack yarn build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(node -e 'console.log(require("./package.json").version)')"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: DSH-Desktop-*
          merge-multiple: true

      - name: Rename artifacts with platform names
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          find . -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) | while read -r f; do
            dir=$(dirname "$f")
            case "$f" in
              *.dmg) new="DSH.Desktop-${VERSION}-macOS-aarch64.dmg" ;;
              *.exe) new="DSH.Desktop-${VERSION}-Windows-x64.exe" ;;
              *.AppImage) new="DSH.Desktop-${VERSION}-Linux-x64.AppImage" ;;
              *.deb) new="DSH.Desktop-${VERSION}-Linux-x64.deb" ;;
            esac
            mv "$f" "$dir/$new"
          done
          find . -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \)

      - name: Extract latest changelog
        id: notes
        shell: bash
        run: |
          awk 'BEGIN{found=0} /^## \[/{if(found) exit; found=1} found{print}' CHANGELOG.md > /tmp/RELEASE_NOTES.md
          if [ ! -s /tmp/RELEASE_NOTES.md ]; then
            printf '# DSH Desktop v%s\n' "${{ steps.version.outputs.VERSION }}" > /tmp/RELEASE_NOTES.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          release_name: DSH Desktop v${{ steps.version.outputs.VERSION }}
          body_path: /tmp/RELEASE_NOTES.md
          files: |
            **/*.dmg
            **/*.exe
            **/*.AppImage
            **/*.deb
