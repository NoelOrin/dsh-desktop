name: CI

on:
  push:
    branches:
      - release
  pull_request:
    paths:
      - "apps/shell/**"
      - "packages/**"
      - "scripts/**"
      - ".github/**"
      - "package.json"
      - "yarn.lock"
      - "biome.json"
      - "lefthook.yml"
      - ".yarnrc.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      bumped: ${{ steps.bump.outputs.bumped }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Enable Corepack
        run: corepack enable

      - name: Bump version
        id: bump
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/bump-version.mjs

      - name: Dispatch CI after bump
        if: steps.bump.outputs.bumped == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh workflow run build.yml --ref "v${VERSION}"
  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.prepare.outputs.bumped == 'false'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-14
            bundles: dmg
            artifact: DSH-Desktop-macOS-arm64
            bundle: |
              apps/shell/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Windows (x64)
            os: windows-latest
            bundles: nsis
            artifact: DSH-Desktop-Windows-x64
            bundle: |
              apps/shell/src-tauri/target/release/bundle/nsis/*.exe
          - name: Linux (x64)
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact: DSH-Desktop-Linux-x64
            bundle: |
              apps/shell/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/shell/src-tauri/target/release/bundle/deb/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/shell/src-tauri

      - name: Get Yarn cache directory
        id: yarn-cache
        shell: bash
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build Tauri app
        run: corepack yarn build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 90
