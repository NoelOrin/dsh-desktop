<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Desktop</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="shell" aria-live="polite">
      <p class="eyebrow">DeepSeek Harness</p>
      <h1>DSH</h1>
      <p class="subtitle">Desktop Runtime</p>

      <div class="loader" aria-hidden="true">
        <span class="loader__arc"></span>
      </div>

      <div class="status" id="status" data-phase="detecting">
        <span class="status__dot"></span>
        <span class="status__text" id="message">正在检测运行环境...</span>
      </div>

      <div class="actions">
        <button id="install" class="hidden">安装 DSH</button>
        <button id="retry" class="hidden">重试</button>
        <button id="open-logs" class="hidden">日志目录</button>
      </div>

      <pre class="logs hidden" id="logs"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
